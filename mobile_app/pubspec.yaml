name: ist_rvt
description: IST-RVT — Real-Time Voice Translator. Speak any language, anywhere.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────
  go_router: ^13.2.0

  # ── State Management ────────────────────────────────
  provider: ^6.1.2
  flutter_bloc: ^8.1.5

  # ── Networking ──────────────────────────────────────
  http: ^1.2.1
  web_socket_channel: ^3.0.3
  dio: ^5.4.3

  # ── Audio Recording & Playback ──────────────────────
  record: ^6.2.0
  just_audio: ^0.9.38
  audioplayers: ^6.0.0

  # ── WebRTC (Voice & Video Calls) ────────────────────
  flutter_webrtc: ^1.4.1

  # ── Local / Offline Translation ─────────────────────
  flutter_translate: ^4.1.0

  # ── Permissions ─────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Local Storage ───────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # ── UI & Animations ─────────────────────────────────
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  # ── Utilities ───────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  convert: ^3.1.1
  equatable: ^2.0.5
  collection: ^1.18.0
  rxdart: ^0.27.7

  # ── Notifications ────────────────────────────────────
  flutter_local_notifications: ^17.2.1+2

  # ── Waveform Visualization ──────────────────────────
  audio_waveforms: ^1.2.0

  # ── Camera ──────────────────────────────────────────
  camera: ^0.11.0+2

  # ── QR Code ─────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── Google Fonts ─────────────────────────────────────
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
